<title>CommercialGuru Listings Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column; summary tiles, then two bar charts side by side, then the full listings table. */
:root {
  --bg: #f5f7f8; --surface: #ffffff; --ink: #14202b; --ink-2: #4a5866; --muted: #7b8894;
  --line: #dde3e8; --accent: #1f5fae; --accent-soft: #e3edf9; --bar: #2f6fbf; --good: #1d7a4c;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f161d; --surface: #161f28; --ink: #e6ecf1; --ink-2: #aab6c1; --muted: #7d8a96;
  --line: #26323d; --accent: #7fb0f0; --accent-soft: #1b2a3b; --bar: #6aa2ea; --good: #5cc28d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f161d; --surface: #161f28; --ink: #e6ecf1; --ink-2: #aab6c1; --muted: #7d8a96;
  --line: #26323d; --accent: #7fb0f0; --accent-soft: #1b2a3b; --bar: #6aa2ea; --good: #5cc28d; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font: 700 clamp(22px, 3.2vw, 30px)/1.1 var(--display); font-stretch: 85%; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.sub { color: var(--ink-2); margin: 4px 0 0; }
.src { font: 12px var(--mono); color: var(--muted); }
.src b { color: var(--ink-2); font-weight: 500; }
.badge { display: inline-block; font: 600 11px var(--body); letter-spacing: .06em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }

.tabs { justify-self: start; display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 3px; background: var(--surface); gap: 3px; }
.tabs button { font: 600 13px var(--body); border: 0; background: transparent; color: var(--ink-2); padding: 7px 16px; border-radius: 6px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--surface); }
.tabs button:focus-visible, .filters :focus-visible, th button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 2px; }
.tile .k { font: 600 11px var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.tile .v { font: 700 26px/1.15 var(--display); font-stretch: 90%; font-variant-numeric: tabular-nums; }
.tile .n { font-size: 12px; color: var(--ink-2); }

.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.panel h2 { font: 650 15px var(--display); font-stretch: 95%; margin: 0 0 2px; }
.panel .note { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 5.5rem; align-items: center; gap: 10px; font-size: 12.5px; position: relative; }
.bar-row .lbl { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .track { height: 14px; position: relative; }
.bar-row .fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row .val { font: 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.bar-row:hover .fill { filter: brightness(1.12); }
.bar-row:hover .lbl { color: var(--ink); }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font: 12px/1.4 var(--body);
  padding: 6px 9px; border-radius: 6px; max-width: 260px; z-index: 5; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters input, .filters select { font: 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 10px; min-width: 0; }
.filters input { flex: 1 1 220px; }
.filters select { flex: 0 1 220px; }
.count { font: 12px var(--mono); color: var(--muted); margin-left: auto; }

.table-box { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 860px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--surface); font: 600 11px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
th button { all: unset; cursor: pointer; }
th button::after { content: attr(data-dir); margin-left: 4px; color: var(--accent); }
td.num { font: 12.5px var(--mono); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
th.num { text-align: right; }
td a { color: var(--ink); text-decoration: none; font-weight: 500; }
td a:hover { color: var(--accent); text-decoration: underline; }
td .meta { display: block; color: var(--muted); font-size: 12px; }
tr.new td:first-child { box-shadow: inset 3px 0 0 var(--good); }
.pill { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
footer { font-size: 12px; color: var(--muted); }

@media (max-width: 820px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .charts { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 440px) { .bar-row { grid-template-columns: minmax(0, 7.5rem) minmax(0, 1fr) 4.8rem; } .tile .v { font-size: 22px; } }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .35s ease; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>CommercialGuru Listings Watch</h1>
      <p class="sub">Singapore commercial property for sale and for rent, refreshed daily.</p>
    </div>
    <div class="src" id="src"></div>
  </header>

  <div class="tabs" role="tablist" aria-label="Listing type">
    <button id="tab-sale" role="tab" aria-selected="true" data-type="sale">Buy</button>
    <button id="tab-rent" role="tab" aria-selected="false" data-type="rent">Rent</button>
  </div>

  <section class="tiles" id="tiles" aria-label="Summary"></section>

  <section class="charts">
    <div class="panel">
      <h2>Median price per sqft by property type</h2>
      <p class="note" id="psf-note"></p>
      <div class="bars" id="chart-type"></div>
    </div>
    <div class="panel">
      <h2>Listings by district group</h2>
      <p class="note">Top 10 CommercialGuru location groups by number of active listings</p>
      <div class="bars" id="chart-loc"></div>
    </div>
  </section>

  <section style="display:grid;gap:10px" aria-label="Listings">
    <div class="filters">
      <input id="q" type="search" placeholder="Search title or building" aria-label="Search listings">
      <select id="f-type" aria-label="Property type"></select>
      <select id="f-loc" aria-label="Location"></select>
      <span class="count" id="count"></span>
    </div>
    <div class="table-box">
      <table>
        <thead><tr>
          <th><button data-sort="title">Listing</button></th>
          <th><button data-sort="property_type">Type</button></th>
          <th><button data-sort="location">Location</button></th>
          <th class="num"><button data-sort="price_sgd">Price</button></th>
          <th class="num"><button data-sort="floor_area_sqft">Area (sqft)</button></th>
          <th class="num"><button data-sort="psf_sgd">S$ psf</button></th>
          <th><button data-sort="tenure">Tenure</button></th>
          <th><button data-sort="first_seen">First seen</button></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <footer id="foot"></footer>
</div>
<div class="tip" id="tip" hidden></div>

<script>
// Live mode: fill these in (Supabase project URL and its public anon key) when hosting
// this page yourself. Left empty, the page shows the bundled sample.
const CONFIG = { supabaseUrl: "", anonKey: "" };

const SAMPLE = /*SAMPLE_DATA*/[]/*END_SAMPLE_DATA*/;

const $ = (s) => document.querySelector(s);
const fmtS = new Intl.NumberFormat("en-SG", { maximumFractionDigits: 0 });
const fmt2 = new Intl.NumberFormat("en-SG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (v) => v == null ? "–" : "S$ " + (v >= 1e6 ? fmt2.format(v / 1e6) + "M" : fmtS.format(v));
const median = (a) => { const s = a.filter((x) => x != null).sort((x, y) => x - y); if (!s.length) return null;
  const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let ALL = [], live = false;
const state = { type: "sale", q: "", ptype: "", loc: "", sort: "first_seen", dir: -1 };
try { const t = localStorage.getItem("cg-tab"); if (t === "sale" || t === "rent") state.type = t; } catch (e) {}

async function load() {
  if (CONFIG.supabaseUrl && CONFIG.anonKey) {
    const h = { apikey: CONFIG.anonKey, Authorization: "Bearer " + CONFIG.anonKey };
    const out = [];
    for (let from = 0; ; from += 1000) {
      const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/listings_current?is_active=eq.true&select=*`,
        { headers: { ...h, Range: `${from}-${from + 999}` } });
      if (!r.ok) throw new Error("Supabase returned " + r.status);
      const page = await r.json(); out.push(...page);
      if (page.length < 1000) break;
    }
    live = true; return out;
  }
  return SAMPLE;
}

function rowsOfType() { return ALL.filter((r) => r.listing_type === state.type && r.is_active !== false); }

function renderTiles(rows) {
  const rent = state.type === "rent";
  const latest = rows.reduce((m, r) => r.first_seen > m ? r.first_seen : m, "");
  const fresh = rows.filter((r) => r.first_seen === latest).length;
  const tiles = [
    ["Active listings", fmtS.format(rows.length), live ? "seen on the latest daily run" : "sample from page 1 of the site"],
    [rent ? "Median rent" : "Median asking price", money(median(rows.map((r) => r.price_sgd))) + (rent ? "/mo" : ""), "across all property types"],
    ["Median S$ psf", "S$ " + fmt2.format(median(rows.map((r) => r.psf_sgd)) ?? 0) + (rent ? "/mo" : ""), "price ÷ floor area"],
    ["New on latest run", fmtS.format(fresh), latest ? "first seen " + latest : "–"],
  ];
  $("#tiles").innerHTML = tiles.map(([k, v, n]) =>
    `<div class="tile"><span class="k">${k}</span><span class="v">${v}</span><span class="n">${n}</span></div>`).join("");
}

function bars(el, items, fmtv, tipf) {
  const max = Math.max(...items.map((i) => i.v), 1);
  el.innerHTML = items.length ? items.map((i, n) =>
    `<div class="bar-row" data-i="${n}"><span class="lbl" title="${esc(i.k)}">${esc(i.k)}</span>
      <span class="track"><span class="fill" style="width:${(i.v / max * 100).toFixed(1)}%"></span></span>
      <span class="val">${fmtv(i.v)}</span></div>`).join("") : `<div class="empty">No listings</div>`;
  el.querySelectorAll(".bar-row").forEach((row) => {
    const i = items[+row.dataset.i];
    row.addEventListener("mousemove", (e) => { const t = $("#tip"); t.innerHTML = tipf(i); t.hidden = false;
      t.style.left = Math.min(e.clientX + 14, innerWidth - 270) + "px"; t.style.top = e.clientY + 14 + "px"; });
    row.addEventListener("mouseleave", () => { $("#tip").hidden = true; });
  });
}

function group(rows, key) {
  const g = new Map();
  rows.forEach((r) => { const k = r[key] || "Unspecified"; (g.get(k) || g.set(k, []).get(k)).push(r); });
  return g;
}

function renderCharts(rows) {
  const rent = state.type === "rent";
  $("#psf-note").textContent = rent ? "Monthly rent per sqft, S$; number of listings in brackets" : "Asking price per sqft, S$; number of listings in brackets";
  const byType = [...group(rows, "property_type")].map(([k, rs]) => ({ k: `${k} (${rs.length})`, name: k, v: median(rs.map((r) => r.psf_sgd)), n: rs.length }))
    .filter((i) => i.v != null).sort((a, b) => b.v - a.v);
  bars($("#chart-type"), byType, (v) => fmt2.format(v),
    (i) => `<b>${esc(i.name)}</b><br>Median S$ ${fmt2.format(i.v)} psf${rent ? "/mo" : ""}<br>${i.n} listing${i.n > 1 ? "s" : ""}`);
  const byLoc = [...group(rows, "location")].map(([k, rs]) => ({ k, v: rs.length, p: median(rs.map((r) => r.psf_sgd)) }))
    .sort((a, b) => b.v - a.v || a.k.localeCompare(b.k)).slice(0, 10);
  bars($("#chart-loc"), byLoc, (v) => fmtS.format(v),
    (i) => `<b>${esc(i.k)}</b><br>${i.v} listing${i.v > 1 ? "s" : ""}<br>Median S$ ${fmt2.format(i.p ?? 0)} psf${rent ? "/mo" : ""}`);
}

function fillSelect(el, label, values, cur) {
  el.innerHTML = `<option value="">All ${label}</option>` + values.map((v) => `<option${v === cur ? " selected" : ""}>${esc(v)}</option>`).join("");
}

function renderTable(rows) {
  const q = state.q.toLowerCase();
  let r = rows.filter((x) => (!state.ptype || x.property_type === state.ptype) && (!state.loc || x.location === state.loc)
    && (!q || (x.title + " " + (x.url || "")).toLowerCase().includes(q)));
  const k = state.sort, d = state.dir;
  r.sort((a, b) => { const x = a[k], y = b[k]; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * d; });
  const latest = rows.reduce((m, x) => x.first_seen > m ? x.first_seen : m, "");
  const rent = state.type === "rent";
  $("#rows").innerHTML = r.length ? r.map((x) => `<tr class="${live && x.first_seen === latest ? "new" : ""}">
    <td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><span class="meta">${esc(x.agency || "")}</span></td>
    <td><span class="pill">${esc(x.property_type || "–")}</span></td>
    <td>${esc(x.location || "–")}</td>
    <td class="num">${money(x.price_sgd)}${rent ? "/mo" : ""}</td>
    <td class="num">${x.floor_area_sqft == null ? "–" : fmtS.format(x.floor_area_sqft)}</td>
    <td class="num">${x.psf_sgd == null ? "–" : fmt2.format(x.psf_sgd)}</td>
    <td>${esc(x.tenure || "–")}</td>
    <td class="num" style="text-align:left">${esc(x.first_seen || "–")}</td></tr>`).join("")
    : `<tr><td colspan="8" class="empty">No listings match these filters. Clear the search or pick “All” in the dropdowns.</td></tr>`;
  $("#count").textContent = `${r.length} of ${rows.length}`;
  document.querySelectorAll("th button").forEach((b) => b.dataset.dir = b.dataset.sort === k ? (d > 0 ? "↑" : "↓") : "");
}

function render() {
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.type === state.type));
  const rows = rowsOfType();
  fillSelect($("#f-type"), "property types", [...new Set(rows.map((r) => r.property_type).filter(Boolean))].sort(), state.ptype);
  fillSelect($("#f-loc"), "locations", [...new Set(rows.map((r) => r.location).filter(Boolean))].sort(), state.loc);
  renderTiles(rows); renderCharts(rows); renderTable(rows);
}

document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  state.type = b.dataset.type; state.ptype = state.loc = "";
  try { localStorage.setItem("cg-tab", state.type); } catch (e) {}
  render();
}));
$("#q").addEventListener("input", (e) => { state.q = e.target.value; renderTable(rowsOfType()); });
$("#f-type").addEventListener("change", (e) => { state.ptype = e.target.value; renderTable(rowsOfType()); });
$("#f-loc").addEventListener("change", (e) => { state.loc = e.target.value; renderTable(rowsOfType()); });
document.querySelectorAll("th button").forEach((b) => b.addEventListener("click", () => {
  if (state.sort === b.dataset.sort) state.dir *= -1; else { state.sort = b.dataset.sort; state.dir = 1; }
  renderTable(rowsOfType());
}));

load().then((d) => {
  ALL = d;
  $("#src").innerHTML = live ? `<span class="badge">Live</span> <b>Supabase</b> · ${ALL.length} listings`
    : `<span class="badge">Sample</span> <b>${ALL.length}</b> real listings from page 1, captured 6 Oct 2026`;
  $("#foot").textContent = "Data: public search pages of commercialguru.com.sg, for personal, non-commercial use under the site's terms. Prices are asking prices, not transactions.";
  render();
}).catch((e) => {
  $("#src").textContent = "Could not load data: " + e.message + ". Check the Supabase URL and anon key in CONFIG.";
  ALL = SAMPLE; render();
});
</script>
